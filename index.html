<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ben | Terminal Portfolio</title>
    <meta
      name="description"
      content="Ben Weinstein — Data Science student at the University of Waterloo. A 100% keyboard-navigable, file-tree-style portfolio website."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <!-- LANDING SCREEN -->
      <section id="landing" class="landing-screen">
        <div class="landing-photo">
          <img
            src="content/images/bweinste.png"
            alt="Ben Weinstein"
            onerror="this.parentElement.classList.add('photo-fallback'); this.remove();"
          />
        </div>
        <div class="landing-name">Ben Weinstein</div>
        <p class="landing-bio">
          Honours Data Science @ University of Waterloo. I build software, data
          tools, and ML models that are fast to read and calm to use.
        </p>
        <div class="landing-prompt">
          <span class="key-hint desktop-only">press <kbd>Enter</kbd> to continue</span>
          <span class="key-hint mobile-only">tap to continue</span>
          <span class="cursor-block">█</span>
        </div>
      </section>

      <!-- FILE TREE EXPLORER -->
      <div id="explorer" class="explorer" hidden>
        <div class="top-chrome" aria-hidden="true">
          <div class="path-breadcrumb" id="path-breadcrumb">~</div>
        </div>

        <div class="explorer-body">
          <nav class="tree-pane" id="tree-pane" aria-label="File tree">
            <div class="tree-header">EXPLORER</div>
            <ul class="tree-root" id="tree-root"></ul>
          </nav>

          <main class="preview-pane" id="preview-pane">
            <div class="preview-empty">select a file to view its contents</div>
          </main>
        </div>

        <button class="mobile-back" id="mobile-back" aria-label="Back to tree">‹ back</button>

        <footer class="statusbar" aria-label="Status line">
          <div class="status-left" id="status-left">~</div>
          <div class="status-center" id="status-center"></div>
          <div class="status-right" aria-hidden="true"><span class="cursor-block">█</span></div>
        </footer>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
